function status(p){if(p.qty===0)return 'Out of Stock';if(p.qty<=p.min)return 'Low Stock';return 'Available'}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(n=>`<button class="${current===n[0]?'active':''}" onclick="showPage('${n[0]}')">${n[1]} <span>${n[2]}</span></button>`).join('')}
function showPage(p){
 current=p;renderNav();
 const c=document.getElementById('appContent');
 if(p==='store')renderStore(c);
 else if(p==='ai')renderAI(c);
 else if(p==='categories')renderCategories(c);
 else if(p==='inventory')renderInventory(c);
 else if(p==='orders'||p==='priority'||p==='picking'||p==='quality'||p==='dispatch')renderOrders(c,p);
 else if(p==='dashboard')renderDashboard(c);
 else if(p==='analytics')renderAnalytics(c);
 else if(p==='reports')renderReports(c);
 else c.innerHTML='<h1 class="pageTitle">Notifications</h1>';
}

function imageFallback(el,p){
  const fallback=categoryFallback[p.cat];
  if(fallback && el.dataset.fallback!=='1'){el.dataset.fallback='1';el.src=fallback;return;}
  el.style.display='none';el.parentElement.classList.add('imageFailed');el.parentElement.innerHTML=`<div style="text-align:center;color:#9bb1bf;padding:18px"><div style="font-size:42px;margin-bottom:8px">📦</div><b>${p.brand}</b><br><span>${p.name}</span></div>`;
}
function productCard(p){
 const s=status(p), d=Math.round((1-p.price/p.mrp)*100);
 const rating=(p.rating||4.6).toFixed(1), reviews=p.reviews||Math.floor(120+products.indexOf(p)*37);
 return `<div class="card product" onclick="openProduct('${p.id}')">
 <div class="productImg"><img src="${p.img}" alt="${p.brand} ${p.name}" loading="lazy" onerror="imageFallback(this,p)"></div>
 <div class="productBody"><div class="brand">${p.brand}</div><h4>${p.name}</h4><div class="stars">★★★★★ <span class="muted">(${rating} · ${reviews} reviews)</span></div>
 <div class="price">${money(p.price)} <span class="mrp">${money(p.mrp)}</span> <span class="discount">${d}% off</span></div>
 <span class="badge ${s==='Low Stock'?'low':s==='Out of Stock'?'out':''}">${s}</span>
 <div class="location">📍 WH-01 · ${p.rack} · Shelf ${p.shelf} · Bin ${p.bin}<br>Stock: <b>${p.qty}</b> units</div>
 <button class="btn block" ${p.qty===0?'disabled':''} onclick="event.stopPropagation();addCart('${p.id}')">${p.qty===0?'Out of Stock':'Add to Cart'}</button>
 </div></div>`
}

function toggleProfile(){const m=document.getElementById('profileMenu');m.classList.toggle('open');document.getElementById('cartCount').textContent=cart.length}
function showProfilePage(type){document.getElementById('profileMenu').classList.remove('open');const c=document.getElementById('appContent');if(type==='cart')renderMyCart(c);else if(type==='orders')renderMyOrders(c);else renderAccount(c)}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const c=document.getElementById('appContent');const rating=(p.rating||4.6).toFixed(1), reviews=p.reviews||Math.floor(120+products.indexOf(p)*37);c.innerHTML=`<button class="btn secondary" onclick="showPage('store')">← Back to Store</button><div class="productDetail card" style="margin-top:18px;display:grid;grid-template-columns:42% 58%;gap:25px"><div><img src="${p.img}" style="width:100%;height:430px;object-fit:contain;border-radius:15px;background:#102f41"></div><div><div class="brand">${p.brand}</div><h1 class="pageTitle" style="margin-top:6px">${p.name}</h1><div class="stars" style="font-size:18px">★★★★★ <span class="muted">${rating} · ${reviews} verified reviews</span></div><h2 class="price">${money(p.price)} <span class="mrp">${money(p.mrp)}</span> <span class="discount">${Math.round((1-p.price/p.mrp)*100)}% off</span></h2><div class="badge ${status(p)==='Low Stock'?'low':status(p)==='Out of Stock'?'out':''}">${status(p)}</div><div class="card" style="margin-top:20px;background:#102f41"><h3>📦 Stock & Warehouse Details</h3><p>Available Stock: <b>${p.qty} units</b></p><p>Minimum Level: <b>${p.min} units</b></p><p>Location: <b>WH-01 → ${p.rack} → Shelf ${p.shelf} → Bin ${p.bin}</b></p></div><div class="card" style="margin-top:14px;background:#102f41"><h3>⭐ Customer Reviews</h3><p>⭐⭐⭐⭐⭐ <b>Excellent product</b> — Verified customer</p><p>⭐⭐⭐⭐⭐ <b>Good quality and fast delivery</b> — Verified customer</p><p class="muted">${reviews} total reviews</p></div><button class="btn" style="margin-top:15px" ${p.qty===0?'disabled':''} onclick="addCart('${p.id}')">${p.qty===0?'Out of Stock':'🛒 Add to My Cart'}</button></div></div>`}
function renderMyCart(c){c.innerHTML=`<h1 class="pageTitle">My Cart</h1><p class="subtitle">Products selected from the Customer Store.</p>${cart.length?`<div class="grid">${cart.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.brand}</p><b>${money(p.price)}</b><button class="btn secondary" style="float:right" onclick="removeCart('${p.id}')">Remove</button></div>`).join('')}</div><div class="card" style="margin-top:20px"><h3>Cart Total: ${money(cart.reduce((a,p)=>a+p.price,0))}</h3><button class="btn" onclick="toast('Demo order placed successfully')">Place Demo Order</button></div>`:`<div class="empty"><h3>Your cart is empty</h3><button class="btn" onclick="showPage('store')">Browse Products</button></div>`}`}
function removeCart(id){const i=cart.findIndex(x=>x.id===id);if(i>=0)cart.splice(i,1);renderMyCart(document.getElementById('appContent'))}
function renderMyOrders(c){if(!orders.length)orders=[{id:'ORD1042',customer:'Harika',items:['ELEC001'],priority:'HIGH',status:'Ready for Dispatch',payment:'Paid',delivery:'Express',date:'18 Aug 2026'}];c.innerHTML=`<h1 class="pageTitle">My Orders</h1><p class="subtitle">Track your orders through the complete warehouse workflow.</p><div class="tableWrap"><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Priority</th><th>Status</th><th>Delivery</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.date}</td><td>${o.priority}</td><td>${o.status}</td><td>${o.delivery}</td></tr>`).join('')}</tbody></table></div>`}
function renderAccount(c){c.innerHTML=`<h1 class="pageTitle">My Profile</h1><div class="card" style="max-width:600px"><div class="profileBig">H</div><h2>Harika</h2><p class="muted">SmartWare Customer Account</p><hr><p>My Orders: <b>${orders.length}</b></p><p>My Cart: <b>${cart.length} items</b></p><p>Account Status: <b>Active</b></p></div>`}

function getFiltered(){
 let q=storeSearch.trim().toLowerCase();
 return products.filter(p=>{
  const catOk=selectedCategory==='All Categories'||p.cat===selectedCategory;
  const text=[p.name,p.brand,p.cat,p.id,p.rack].join(' ').toLowerCase();
  return catOk && (!q||text.includes(q));
 })
}
function renderStore(c){
 c.innerHTML=`<h1 class="pageTitle">Customer Store</h1><p class="subtitle">Browse the complete warehouse catalogue. Select a category or search any product.</p>
 <div class="hero"><div><h2>🤖 AI-Powered Shopping + Warehouse Intelligence</h2><p>Find products, stock and exact warehouse locations instantly.</p></div><button class="heroAI" onclick="showPage('ai')" aria-label="Open KW AI Assistant">KW AI Assistant →</button></div>
 <div class="storeTools"><input id="storeSearch" value="${storeSearch}" placeholder="Search by product, brand, category, product ID or rack...">
 <select id="categorySelect">${['All Categories',...categories.map(x=>x[0])].map(x=>`<option ${x===selectedCategory?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="categoryStrip">${[['All Categories','✨'],...categories].map(x=>`<button class="catBtn ${selectedCategory===x[0]?'active':''}" onclick="selectCategory('${x[0]}')">${x[1]} ${x[0]}</button>`).join('')}</div>
 <div class="sectionHead"><h3>${selectedCategory}</h3><span class="muted">${getFiltered().length} products found</span></div>
 <div class="products" id="productGrid"></div>`;
 document.getElementById('storeSearch').oninput=e=>{storeSearch=e.target.value;renderProductsOnly()};
 document.getElementById('categorySelect').onchange=e=>{selectedCategory=e.target.value;storeSearch='';renderStore(document.getElementById('appContent'))};
 renderProductsOnly();
}
function renderProductsOnly(){const g=document.getElementById('productGrid');if(!g)return;const arr=getFiltered();g.innerHTML=arr.length?arr.map(productCard).join(''):`<div class="empty"><h3>No products found</h3><p>Try another search or choose <b>All Categories</b>.</p><button class="btn" onclick="selectCategory('All Categories')">Show All Products</button></div>`}
function selectCategory(cat){selectedCategory=cat;storeSearch='';renderStore(document.getElementById('appContent'))}
function addCart(id){const p=products.find(x=>x.id===id);if(!p||p.qty===0)return toast('This product is currently unavailable.');cart.push(p);toast(`${p.name} added to cart`);renderStore(document.getElementById('appContent'))}
function renderCategories(c){
 c.innerHTML=`<h1 class="pageTitle">Product Categories</h1><p class="subtitle">Every category is connected to the same live warehouse catalogue.</p>
 <div class="categoryCards">${categories.map(x=>{let count=products.filter(p=>p.cat===x[0]).length;return `<div class="categoryCard"><div class="categoryIcon">${x[1]}</div><h3>${x[0]}</h3><p class="muted">${count} products</p><button class="btn secondary" onclick="selectCategory('${x[0]}');showPage('store')">Browse Category</button></div>`}).join('')}</div>`;
}
function aiAnswer(q){
 const s=q.toLowerCase();
 let matches=products.filter(p=>{
  const terms=[p.name,p.brand,p.cat].join(' ').toLowerCase();
  const keys=s.replace(/[?,.!]/g,' ').split(/\s+/).filter(Boolean);
  return keys.some(k=>k.length>2&&terms.includes(k));
 });
 const brand=['hp','dell','lenovo','asus','apple','samsung','sony','lg','nike','adidas','puma','bata','sparx','biba','fabindia','manyavar','lakme','maybelline','cetaphil','philips','wakefit'].find(b=>s.includes(b));
 if(brand)matches=products.filter(p=>p.brand.toLowerCase().includes(brand));
 const cat=categories.find(x=>s.includes(x[0].toLowerCase().split(' ')[0]));
 if(cat && !brand)matches=products.filter(p=>p.cat===cat[0]);
 if(s.includes('laptop')&&!brand)matches=products.filter(p=>/laptop/i.test(p.name));
 if(s.includes('shoe')&&!brand)matches=products.filter(p=>p.cat==='Shoes & Sandals');
 if(s.includes('rice'))matches=products.filter(p=>/rice/i.test(p.name));
 if(!matches.length)return `Sorry, I couldn't find a matching product. Try <b>“I need a laptop”</b>, <b>“find Nike shoes”</b>, <b>“Samsung TV”</b>, <b>“rice”</b>, or a category name.`;
 matches=matches.slice(0,5);
 return `<b>🤖 KW AI found ${matches.length} matching product${matches.length>1?'s':''}:</b><br><br>`+matches.map(p=>`<div style="padding:10px 0;border-bottom:1px solid #2a5a70"><b>${p.brand} ${p.name}</b><br>Stock: <b>${p.qty}</b> units · ${money(p.price)}<br>📍 WH-01 → ${p.rack} → Shelf ${p.shelf} → Bin ${p.bin}<br>Status: <b>${status(p)}</b></div>`).join('');
}

 <div class="aiChat" id="aiChat"><div class="msg bot">Hello! I’m <b>KW AI</b>. Ask me things like:<br>• “I need a laptop”<br>• “Where is the HP laptop?”<br>• “Find Nike shoes”<br>• “Do you have Samsung TV?”<br>• “Is rice available?”</div></div>

 c.innerHTML=`<h1 class="pageTitle">${title}</h1><p class="subtitle">${sub}</p><div class="tableWrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Priority</th><th>Status</th><th>Payment</th><th>Delivery</th><th>Action</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.customer}</td><td>${o.priority}</td><td>${o.status}</td><td>${o.payment}</td><td>${o.delivery}</td><td><button class="btn secondary" onclick="advanceOrder('${o.id}')">Advance</button></td></tr>`).join('')}</tbody></table></div>`
